<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PathFinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/atracoes.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="iconLogo">🛣️</div>
      <a href="/" style="text-decoration: none;"><span class="logo-text">PathFinder</span></a>
      <div class="nav-divider"></div>
      <span class="nav-breadcrumb">Resultados › Atrações</span>
    </div>
    <div class="nav-right">
      <button class="btn-voltar" id="btnVoltar">← Voltar</button>
      <div class="plate-chip" id="plateChip">AB · 12 · CD</div>
    </div>
  </nav>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="section-label">CIDADES DA ROTA</div>
      <ul class="city-list" id="cityList"></ul>
    </aside>

    <!-- MAIN -->
    <main class="main-area" id="mainArea">

      <div class="city-header">
        <div>
          <h1 id="cityName">—</h1>
          <div class="city-meta" id="cityMeta"></div>
        </div>
        <div class="ai-badge">🤖 Gerado por IA</div>
      </div>

      <!-- Cards de atrações -->
      <div class="cards-grid" id="cardsGrid">
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
      </div>

      <!-- Resposta completa -->
      <div class="llm-box" id="llmBox">
        <div class="llm-box-header">
          <div class="llm-icon">🤖</div>
          <div>
            <div class="llm-title">Resposta completa do modelo</div>
            <div class="llm-sub">Ollama · llama3.1:8b</div>
          </div>
          <div class="llm-time" id="llmTime"></div>
        </div>
        <div class="llm-body" id="llmBody">A carregar...</div>
      </div>

    </main>
  </div>

  <script src="/static/atracoes.js"></script>
</body>
</html>
