{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficar</title>
    <link rel="stylesheet" href="{% static 'trabproject28335/style/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <!-- Painel esquerdo -->
    <div class="left-panel">
        <img src="{% static 'trabproject28335/images/oficar.png' %}" alt="Oficar Zero Avarias" class="logo-image">
    </div>
    <!-- Painel direito -->
    <div class="right-panel d-flex justify-content-center align-items-center">
        <form class="login-form" action="{% url 'login' %}" method="post"> 
            {% csrf_token %}
            <h2 class="login-title">Login</h2>
            <div class="mb-3">
                <input type="text" name="f_id" class="form-control" placeholder="Número de Funcionário" required>
            </div>
            <div class="mb-3">
                <input type="password" name="f_pass" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
