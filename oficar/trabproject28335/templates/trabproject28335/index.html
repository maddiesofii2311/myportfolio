{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficar</title>
    <link rel="stylesheet" href="{% static 'trabproject28335/style/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <!-- Painel esquerdo -->
    <div class="left-panel">
        <img src="{% static 'trabproject28335/images/oficar.png' %}" alt="Oficar Zero Avarias" class="logo-image">
    </div>
    <!-- Painel direito -->
    <div class="right-panel d-flex justify-content-center align-items-center">
        <form class="login-form index-form" action="{% url 'login' %}" method="post">
            {% csrf_token %}<h4 class="index-title">Faça o seu Login</h4>
            <div class="d-grid gap-2"> 
                <button type="submit" class="btn index-btn">Login</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
