{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'trabproject28335/style/funcionario.css' %}">
</head>
<body>

<div class="d-flex" id="wrapper">
    
    <div class="sidebar-wrapper bg-dark text-white p-0" id="sidebar-wrapper">
        <div class="sidebar-heading p-3 d-flex justify-content-center">
            <img src="{% static 'trabproject28335/images/oficar.png' %}" alt="Logo Oficar" class="logo-small">
        </div>
        
        <div class="list-group list-group-flush mt-3">
    
            <a href="{% url 'dashboardAdmGes' %}" class="list-group-item list-group-item-action sidebar-item">
                <div class="menu-content-wrapper">
                    <i class="bi bi-grid-fill"></i> Dashboard 
                </div>
            </a>
            
            <a href="{% url 'clientes' %}" class="list-group-item list-group-item-action sidebar-item">
                <div class="menu-content-wrapper">
                    <i class="bi bi-person-fill"></i> Clientes 
                </div>
            </a>
            
            <a href="{% url 'veiculos' %}" class="list-group-item list-group-item-action sidebar-item">
                <div class="menu-content-wrapper">
                    <i class="fas fa-car"></i> Veículos 
                </div>
            </a>

            <a href="{% url 'funcionarios' %}" class="list-group-item list-group-item-action sidebar-item">
                <div class="menu-content-wrapper">
                    <i class="bi bi-people-fill"></i> Funcionários
                </div>
            </a>

            <a href="{% url 'pecas' %}" class="list-group-item list-group-item-action sidebar-item sidebar-active">
                <div class="menu-content-wrapper">
                    <i class="bi bi-wrench-adjustable"></i> Peças
                </div>
            </a>

            <a href="{% url 'servicos' %}" class="list-group-item list-group-item-action sidebar-item">
                <div class="menu-content-wrapper">
                    <i class="bi bi-file-check-fill"></i> Serviços
                </div>
            </a>
        </div>
    </div>
    
    <div id="page-content-wrapper">
        
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom py-3">
            <div class="container-fluid">
                <h1 class="dashboard-title mb-0">Peças</h1>
                
                <div class="welcome-user d-flex align-items-center position-relative">
                    <span class="me-3">Bem vindo, <strong>{{ request.session.nome }}</strong></span>
                    <i class="fas fa-user-circle user-icon" id="userIcon"></i>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="{% url 'logout' %}" class="user-dropdown-item">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid py-4 main-content main-content-funcionario">
        </br>    
            <div class="d-flex justify-content-center mb-4">
                <a href="{% url 'pecas' %}" class="btn-adicionar-os" style="text-decoration: none;">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>
        </br></br>
            <div class="form-criar-os-container">
                <form class="form-criar-os" method="post" action="{% url 'addPecas' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="nome">Nome</label>
                                <input type="text" name="nome" class="form-control" id="nome" placeholder="">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="preco">Preço</label>
                                <input type="text" name="preco" class="form-control" id="preco" placeholder="">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="descricaoProblema">Descrição</label>
                                <textarea name="descricaoProblema" class="form-control" id="descricaoProblema" rows="3" placeholder=""></textarea>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="stock">Stock</label>
                                <input type="text" name="stock" class="form-control" id="stock" placeholder="">
                            </div>
                            <div class="d-flex justify-content-center mt-4">
                                <button type="submit" class="btn-adicionar-minhaos">Adicionar Peça</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'trabproject28335/js/minhasOS.js' %}"></script>
<script src="{% static 'trabproject28335/js/dashboard.js' %}"></script>
</body>
</html>
